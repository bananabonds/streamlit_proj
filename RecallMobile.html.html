<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ARC Lecture Bank — Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root[data-theme="light"]{
  --bg:#F5F4EF; --bg-grid:rgba(14,124,123,0.06);
  --surface:#FFFFFF; --surface-2:#FBFAF6;
  --border:#E1DED4; --ink:#1B221F; --ink-dim:#5B6460;
  --accent:#0E7C7B; --accent-ink:#FFFFFF;
  --amber:#B8720A; --good:#2F7A4D; --good-bg:#E4F3E9;
  --bad:#B23B3B; --bad-bg:#FBE9E7;
  --shadow:0 1px 2px rgba(27,34,31,0.06), 0 8px 24px rgba(27,34,31,0.07);
}
:root[data-theme="dark"]{
  --bg:#0F1613; --bg-grid:rgba(53,197,190,0.07);
  --surface:#17201C; --surface-2:#1D2723;
  --border:#2A342F; --ink:#E9ECE6; --ink-dim:#93A19B;
  --accent:#35C5BE; --accent-ink:#06201E;
  --amber:#F0A93A; --good:#4FBE7C; --good-bg:#123122;
  --bad:#E5726C; --bad-bg:#331A19;
  --shadow:0 1px 2px rgba(0,0,0,0.35), 0 10px 30px rgba(0,0,0,0.4);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:var(--bg);
  background-image:radial-gradient(var(--bg-grid) 1px, transparent 1px);
  background-size:18px 18px;
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease, color .25s ease;
}
.mono{font-family:'IBM Plex Mono', monospace;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

#app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:14px 14px 28px;
}

/* ---------- Header ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:6px 2px 14px;
}
.brand{display:flex; flex-direction:column; line-height:1.15;}
.brand .eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); font-weight:600;
}
.brand h1{font-size:19px; margin:2px 0 0; font-weight:700; letter-spacing:-.01em;}

.theme-toggle{
  display:flex; align-items:center; gap:2px;
  background:var(--surface); border:1px solid var(--border); border-radius:999px;
  padding:3px; box-shadow:var(--shadow);
}
.theme-toggle button{
  width:30px; height:30px; border-radius:999px; border:none; background:transparent;
  color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background .15s, color .15s;
}
.theme-toggle button.active{background:var(--accent); color:var(--accent-ink);}
.theme-toggle svg{width:15px; height:15px;}

/* ---------- Cards / layout ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  box-shadow:var(--shadow); padding:16px;
}
.stack{display:flex; flex-direction:column; gap:12px;}
.center-flex{flex:1; display:flex; flex-direction:column; justify-content:center;}
.section-label{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-dim); font-weight:600; margin:4px 2px 2px;
}
.helptext{font-size:13px; color:var(--ink-dim); margin:0 2px;}

/* ---------- Loading / error ---------- */
.loader-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding:40px 10px;}
.spinner{
  width:34px; height:34px; border-radius:50%;
  border:3px solid var(--border); border-top-color:var(--accent);
  animation:spin 0.85s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Topic list ---------- */
.topic-item{
  display:flex; align-items:center; gap:12px;
  padding:12px 12px; border:1px solid var(--border); border-radius:12px;
  background:var(--surface-2); cursor:pointer; user-select:none;
  transition:border-color .15s, background .15s;
}
.topic-item.selected{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface-2));}
.topic-check{
  width:20px; height:20px; border-radius:6px; border:2px solid var(--ink-dim);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  transition:border-color .15s, background .15s;
}
.topic-item.selected .topic-check{background:var(--accent); border-color:var(--accent);}
.topic-check svg{width:12px; height:12px; opacity:0; transition:opacity .1s;}
.topic-item.selected .topic-check svg{opacity:1;}
.topic-name{font-weight:600; font-size:14.5px;}
.topic-count{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-dim); margin-top:1px;}
.topic-meta{flex:1; min-width:0;}

.select-all-row{display:flex; justify-content:space-between; align-items:center; margin:2px 2px 0;}
.linklike{background:none; border:none; color:var(--accent); font-weight:600; font-size:12.5px; cursor:pointer; padding:4px;}

/* ---------- Segmented control ---------- */
.segmented{
  display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:3px; gap:3px;
}
.segmented button{
  flex:1; border:none; background:transparent; padding:10px 6px; border-radius:9px;
  color:var(--ink-dim); font-weight:600; font-size:12.5px; cursor:pointer; text-align:center; line-height:1.3;
}
.segmented button.active{background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow);}
.segmented small{display:block; font-weight:400; font-size:10.5px; opacity:.85; margin-top:2px;}

/* ---------- Buttons ---------- */
.btn-primary{
  width:100%; padding:14px 16px; border-radius:12px; border:none;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:15px;
  cursor:pointer; box-shadow:var(--shadow); transition:opacity .15s, transform .05s;
}
.btn-primary:disabled{opacity:.4; cursor:not-allowed;}
.btn-primary:active:not(:disabled){transform:scale(0.99);}
.btn-secondary{
  width:100%; padding:12px 16px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink); font-weight:600; font-size:14px; cursor:pointer;
}
.btn-ghost{
  background:none; border:none; color:var(--ink-dim); font-weight:600; font-size:13px; cursor:pointer; padding:8px;
}

/* ---------- Quiz screen ---------- */
.quiz-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.progress-track{flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .25s ease;}
.progress-label{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-dim); white-space:nowrap;}
.timer-row{font-family:'IBM Plex Mono', monospace; font-size:12px; text-align:right; color:var(--ink-dim); margin:-2px 2px 10px;}
.timer-row.warn{color:var(--bad); font-weight:700;}
.timedout-banner{
  border:1px solid var(--bad); background:var(--bad-bg); color:var(--bad);
  text-align:center; font-weight:700; font-size:13px; padding:10px 12px; border-radius:12px;
}
.topic-tag{
  display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:8px;
}
.question-text{font-size:16px; line-height:1.5; font-weight:600; white-space:pre-wrap;}

.options{display:flex; flex-direction:column; gap:9px; margin-top:14px;}
.option{
  display:flex; align-items:center; gap:11px; text-align:left;
  padding:12px 12px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2);
  cursor:pointer; font-size:14px; color:var(--ink); width:100%;
}
.option:active{transform:scale(0.995);}
.option-badge{
  width:26px; height:26px; border-radius:8px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:12.5px;
  border:1.5px solid var(--border); color:var(--ink-dim); background:var(--surface);
}
.option.correct{border-color:var(--good); background:var(--good-bg);}
.option.correct .option-badge{background:var(--good); border-color:var(--good); color:#fff;}
.option.incorrect{border-color:var(--bad); background:var(--bad-bg);}
.option.incorrect .option-badge{background:var(--bad); border-color:var(--bad); color:#fff;}
.option.dim{opacity:.55;}
.option:disabled{cursor:default;}

.next-row{margin-top:16px;}
.feedback-note{
  margin-top:10px; font-size:12.5px; font-weight:600; text-align:center;
}
.feedback-note.correct{color:var(--good);}
.feedback-note.incorrect{color:var(--bad);}

/* ---------- Results ---------- */
.score-hero{text-align:center; padding:8px 4px 4px;}
.score-num{font-family:'IBM Plex Mono', monospace; font-size:44px; font-weight:700; letter-spacing:-.02em;}
.score-sub{color:var(--ink-dim); font-size:13px; margin-top:2px;}

.export-row{display:flex; gap:10px;}
.export-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:12px 8px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2);
  cursor:pointer; font-weight:600; font-size:12.5px; color:var(--ink);
}
.export-btn svg{width:18px; height:18px; color:var(--accent);}

.review-item{
  border-left:3px solid var(--border); padding:9px 0 9px 12px; margin-bottom:2px;
}
.review-item.correct{border-left-color:var(--good);}
.review-item.incorrect{border-left-color:var(--bad);}
.review-q{font-size:13px; font-weight:600; line-height:1.4;}
.review-a{font-size:12px; color:var(--ink-dim); margin-top:4px; line-height:1.5;}
.review-a b{color:var(--ink);}
.chip{
  display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:700;
  padding:1px 6px; border-radius:999px; margin-left:6px; vertical-align:middle;
}
.chip.correct{background:var(--good-bg); color:var(--good);}
.chip.incorrect{background:var(--bad-bg); color:var(--bad);}

.footnote{text-align:center; font-size:11px; color:var(--ink-dim); margin-top:18px; padding:0 10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   1. Minimal Python-literal parser (no code execution)
   Parses `NAME = [ {..}, {..} ]` style modules into JS objects.
   Handles: single/double-quoted strings w/ escapes, #-comments,
   nested lists/dicts, numbers. This replaces the original
   script's exec() of remote code with safe, sandboxed parsing.
   ============================================================ */
function parsePyModule(src) {
  let i = 0;
  const n = src.length;

  function skipWsAndComments() {
    while (i < n) {
      const c = src[i];
      if (c === ' ' || c === '\t' || c === '\r' || c === '\n') { i++; continue; }
      if (c === '#') { while (i < n && src[i] !== '\n') i++; continue; }
      break;
    }
  }
  function parseString() {
    const quote = src[i]; i++;
    let out = '';
    while (i < n && src[i] !== quote) {
      let c = src[i];
      if (c === '\\') {
        i++;
        const e = src[i];
        if (e === 'n') out += '\n';
        else if (e === 't') out += '\t';
        else if (e === 'r') out += '\r';
        else if (e === undefined) { /* eof safety */ }
        else out += e;
        i++;
      } else {
        out += c; i++;
      }
    }
    i++;
    return out;
  }
  function parseNumber() {
    let start = i;
    if (src[i] === '-' || src[i] === '+') i++;
    while (i < n && /[0-9]/.test(src[i])) i++;
    if (src[i] === '.') { i++; while (i < n && /[0-9]/.test(src[i])) i++; }
    return Number(src.slice(start, i));
  }
  function parseValue() {
    skipWsAndComments();
    const c = src[i];
    if (c === "'" || c === '"') return parseString();
    if (c === '[') return parseList();
    if (c === '{') return parseDict();
    if (c === '-' || c === '+' || (c >= '0' && c <= '9')) return parseNumber();
    let start = i;
    while (i < n && /[A-Za-z_0-9]/.test(src[i])) i++;
    if (i === start) { i++; return null; }
    return src.slice(start, i);
  }
  function parseList() {
    i++;
    const arr = [];
    skipWsAndComments();
    while (i < n && src[i] !== ']') {
      arr.push(parseValue());
      skipWsAndComments();
      if (src[i] === ',') { i++; skipWsAndComments(); }
    }
    i++;
    return arr;
  }
  function parseDict() {
    i++;
    const obj = {};
    skipWsAndComments();
    while (i < n && src[i] !== '}') {
      const key = parseValue();
      skipWsAndComments();
      if (src[i] === ':') i++;
      skipWsAndComments();
      const val = parseValue();
      obj[key] = val;
      skipWsAndComments();
      if (src[i] === ',') { i++; skipWsAndComments(); }
    }
    i++;
    return obj;
  }

  const topics = {};
  skipWsAndComments();
  let guard = 0;
  while (i < n && guard < 2000000) {
    guard++;
    skipWsAndComments();
    if (i >= n) break;
    let start = i;
    while (i < n && /[A-Za-z_0-9]/.test(src[i])) i++;
    const name = src.slice(start, i);
    if (!name) { i++; continue; }
    skipWsAndComments();
    if (src[i] === '=') {
      i++;
      skipWsAndComments();
      const val = parseValue();
      topics[name] = val;
    }
    skipWsAndComments();
  }
  return topics;
}

/* ============================================================
   2. App state + data source
   ============================================================ */
const DATA_URL = "https://raw.githubusercontent.com/bananabonds/streamlit_proj/refs/heads/main/ARCLectureBank.py";

const state = {
  screen: 'loading',      // loading | error | setup | quiz | results
  theme: 'auto',          // light | dark | auto
  topics: {},             // { topicName: [ {text, options, correct}, ... ] }
  selected: new Set(),
  feedbackMode: 'immediate', // immediate | deferred
  quizQuestions: [],
  currentIndex: 0,
  score: 0,
  answers: [],
  locked: false,
  lockedChoice: null,
  errorMsg: '',
  quizEndTime: 0,        // Date.now() timestamp when the 3-hour timer expires
  questionStartTime: 0,  // Date.now() timestamp when current question was shown
  timedOut: false
};

const QUIZ_TIME_LIMIT_MS = 3 * 60 * 60 * 1000; // 3 hours
let timerInterval = null;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function stripLabel(opt) {
  return String(opt).replace(/^[A-D]\.\s*/, '');
}
function dateStamp() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

/* ---- Countdown timer (3-hour session limit) ---- */
function formatDuration(ms) {
  let s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60); s %= 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function startTimer() {
  clearInterval(timerInterval);
  state.quizEndTime = Date.now() + QUIZ_TIME_LIMIT_MS;
  tickTimer();
  timerInterval = setInterval(tickTimer, 1000);
}
function tickTimer() {
  if (state.screen !== 'quiz') { clearInterval(timerInterval); return; }
  const remain = state.quizEndTime - Date.now();
  const el = document.getElementById('timeLeft');
  if (el) {
    el.textContent = '⏱ ' + formatDuration(remain);
    el.classList.toggle('warn', remain <= 5 * 60 * 1000);
  }
  if (remain <= 0) endQuizTimeUp();
}
function endQuizTimeUp() {
  clearInterval(timerInterval);
  // Mark every question that was never reached (including the one in
  // progress) as unanswered so the report accounts for all of them.
  for (let idx = state.answers.length; idx < state.quizQuestions.length; idx++) {
    const q = state.quizQuestions[idx];
    state.answers.push({
      topic: q.topic,
      text: q.text,
      userText: '(not answered — time expired)',
      correctText: stripLabel(q.options[q.correct]),
      correct: false,
      timeTakenSec: null
    });
  }
  state.timedOut = true;
  state.locked = false;
  state.screen = 'results';
  render();
}

/* ============================================================
   3. Theme handling
   ============================================================ */
function applyTheme() {
  let effective = state.theme;
  if (effective === 'auto') {
    effective = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', effective);
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (state.theme === 'auto') applyTheme();
});
function setTheme(t) { state.theme = t; applyTheme(); render(); }

/* ============================================================
   4. Data loading
   ============================================================ */
async function loadData() {
  state.screen = 'loading';
  render();
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('Network response was not ok (' + res.status + ')');
    const text = await res.text();
    const parsed = parsePyModule(text);
    const topics = {};
    Object.keys(parsed).forEach(key => {
      const val = parsed[key];
      if (Array.isArray(val) && val.length && val[0] && typeof val[0] === 'object' && 'text' in val[0] && 'options' in val[0]) {
        // filter out any malformed entries
        topics[key] = val.filter(q => q && q.text && Array.isArray(q.options) && q.options.length >= 2 && typeof q.correct === 'number');
      }
    });
    if (Object.keys(topics).length === 0) throw new Error('No recognizable topics found in the question bank.');
    state.topics = topics;
    state.selected = new Set(Object.keys(topics));
    state.screen = 'setup';
  } catch (err) {
    state.errorMsg = err.message || String(err);
    state.screen = 'error';
  }
  render();
}

/* ============================================================
   5. Quiz flow
   ============================================================ */
function startQuiz() {
  let pool = [];
  state.selected.forEach(topicName => {
    (state.topics[topicName] || []).forEach(q => pool.push({ ...q, topic: topicName }));
  });
  state.quizQuestions = shuffle(pool);
  state.currentIndex = 0;
  state.score = 0;
  state.answers = [];
  state.locked = false;
  state.lockedChoice = null;
  state.timedOut = false;
  state.questionStartTime = Date.now();
  state.screen = 'quiz';
  render();
  startTimer();
}

function chooseAnswer(idx) {
  if (state.locked) return;
  const q = state.quizQuestions[state.currentIndex];
  const isCorrect = idx === q.correct;
  if (isCorrect) state.score++;
  const timeTakenSec = Math.max(0, (Date.now() - state.questionStartTime) / 1000);

  state.answers.push({
    topic: q.topic,
    text: q.text,
    userText: stripLabel(q.options[idx]),
    correctText: stripLabel(q.options[q.correct]),
    correct: isCorrect,
    timeTakenSec: timeTakenSec
  });

  if (state.feedbackMode === 'immediate') {
    state.locked = true;
    state.lockedChoice = idx;
    render();
  } else {
    advance();
  }
}

function advance() {
  state.locked = false;
  state.lockedChoice = null;
  if (state.currentIndex + 1 < state.quizQuestions.length) {
    state.currentIndex++;
    state.questionStartTime = Date.now();
    render();
  } else {
    clearInterval(timerInterval);
    state.screen = 'results';
    render();
  }
}

function restart() {
  clearInterval(timerInterval);
  state.screen = 'setup';
  state.answers = [];
  state.currentIndex = 0;
  state.score = 0;
  state.timedOut = false;
  render();
}

/* ============================================================
   6. Export: Excel + PDF
   ============================================================ */
function exportExcel() {
  const rows = [["#", "Topic", "Question", "Your Answer", "Correct Answer", "Result", "Time Taken (s)"]];
  state.answers.forEach((a, idx) => {
    rows.push([idx + 1, a.topic, a.text, a.userText, a.correctText, a.correct ? "Correct" : "Incorrect", a.timeTakenSec != null ? Number(a.timeTakenSec.toFixed(1)) : ""]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 4 }, { wch: 12 }, { wch: 55 }, { wch: 26 }, { wch: 26 }, { wch: 10 }, { wch: 12 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Results");
  XLSX.writeFile(wb, `ARC_Quiz_Results_${dateStamp()}.xlsx`);
}

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pct = state.quizQuestions.length ? ((state.score / state.quizQuestions.length) * 100).toFixed(1) : "0.0";

  doc.setFontSize(14);
  doc.text("ARC Lecture Bank — Quiz Results", 14, 16);
  doc.setFontSize(10);
  doc.setTextColor(90);
  doc.text(`Score: ${state.score} / ${state.quizQuestions.length}  (${pct}%)`, 14, 23);
  doc.text(`Topics: ${Array.from(state.selected).join(', ')}`, 14, 28);
  doc.text(`Generated: ${dateStamp()}`, 14, 33);

  doc.autoTable({
    startY: 38,
    head: [["#", "Question", "Your Answer", "Correct Answer", "Result", "Time (s)"]],
    body: state.answers.map((a, idx) => [
      idx + 1, a.text, a.userText, a.correctText, a.correct ? "Correct" : "Wrong",
      a.timeTakenSec != null ? a.timeTakenSec.toFixed(1) : "—"
    ]),
    styles: { fontSize: 7.5, cellPadding: 2, overflow: 'linebreak' },
    headStyles: { fillColor: [14, 124, 123] },
    columnStyles: {
      0: { cellWidth: 8 },
      1: { cellWidth: 74 },
      2: { cellWidth: 34 },
      3: { cellWidth: 34 },
      4: { cellWidth: 16 },
      5: { cellWidth: 16 }
    },
    didParseCell: function (data) {
      if (data.section === 'body' && data.column.index === 4) {
        if (data.cell.raw === 'Wrong') data.cell.styles.textColor = [178, 59, 59];
        else data.cell.styles.textColor = [47, 122, 77];
      }
    }
  });
  doc.save(`ARC_Quiz_Results_${dateStamp()}.pdf`);
}

/* ============================================================
   7. Rendering
   ============================================================ */
function iconSun() { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`; }
function iconAuto() { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>`; }
function iconMoon() { return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5a8.5 8.5 0 1 1-9-13 7 7 0 0 0 9 13z"/></svg>`; }
function iconCheck() { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>`; }
function iconXls() { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>`; }
function iconPdf() { return iconXls(); }

function topbarHtml() {
  const t = state.theme;
  return `
  <div class="topbar">
    <div class="brand">
      <span class="eyebrow">Chemical Engineering &middot; Board Review</span>
      <h1>ARC Lecture Bank</h1>
    </div>
    <div class="theme-toggle">
      <button aria-label="Light theme" class="${t==='light'?'active':''}" onclick="setTheme('light')">${iconSun()}</button>
      <button aria-label="Auto theme" class="${t==='auto'?'active':''}" onclick="setTheme('auto')">${iconAuto()}</button>
      <button aria-label="Dark theme" class="${t==='dark'?'active':''}" onclick="setTheme('dark')">${iconMoon()}</button>
    </div>
  </div>`;
}

function renderLoading() {
  return `
  ${topbarHtml()}
  <div class="center-flex">
    <div class="loader-wrap">
      <div class="spinner"></div>
      <div>
        <div style="font-weight:700; font-size:15px;">Loading question bank</div>
        <div class="helptext">Fetching and parsing the latest lecture data&hellip;</div>
      </div>
    </div>
  </div>`;
}

function renderError() {
  return `
  ${topbarHtml()}
  <div class="center-flex">
    <div class="card stack" style="text-align:center;">
      <div style="font-weight:700; font-size:15px;">Couldn't load the question bank</div>
      <div class="helptext">${state.errorMsg}</div>
      <button class="btn-primary" onclick="loadData()">Try again</button>
    </div>
  </div>`;
}

function renderSetup() {
  const names = Object.keys(state.topics);
  const allSelected = names.every(n => state.selected.has(n));
  const topicItems = names.map(name => {
    const count = state.topics[name].length;
    const sel = state.selected.has(name);
    return `
    <div class="topic-item ${sel?'selected':''}" onclick="toggleTopic('${name.replace(/'/g,"\\'")}')">
      <div class="topic-check">${iconCheck()}</div>
      <div class="topic-meta">
        <div class="topic-name">${name}</div>
        <div class="topic-count mono">${count} question${count===1?'':'s'}</div>
      </div>
    </div>`;
  }).join('');

  const totalSelected = Array.from(state.selected).reduce((sum, n) => sum + (state.topics[n]?.length || 0), 0);

  return `
  ${topbarHtml()}
  <div class="stack">
    <div class="section-label">Choose topics</div>
    <div class="select-all-row">
      <div class="helptext">${state.selected.size} of ${names.length} selected</div>
      <button class="linklike" onclick="toggleAllTopics(${!allSelected})">${allSelected ? 'Clear all' : 'Select all'}</button>
    </div>
    <div class="stack" style="gap:8px;">${topicItems}</div>

    <div class="section-label" style="margin-top:8px;">Answer feedback</div>
    <div class="segmented">
      <button class="${state.feedbackMode==='immediate'?'active':''}" onclick="setFeedbackMode('immediate')">
        Reveal each answer<small>Right/wrong shown per question</small>
      </button>
      <button class="${state.feedbackMode==='deferred'?'active':''}" onclick="setFeedbackMode('deferred')">
        Reveal at the end<small>See results only in the report</small>
      </button>
    </div>

    <button class="btn-primary" style="margin-top:6px;" ${totalSelected===0?'disabled':''} onclick="startQuiz()">
      Start quiz &middot; ${totalSelected} question${totalSelected===1?'':'s'}
    </button>
  </div>`;
}

function toggleTopic(name) {
  if (state.selected.has(name)) state.selected.delete(name);
  else state.selected.add(name);
  render();
}
function toggleAllTopics(selectAll) {
  const names = Object.keys(state.topics);
  state.selected = selectAll ? new Set(names) : new Set();
  render();
}
function setFeedbackMode(mode) { state.feedbackMode = mode; render(); }

function renderQuiz() {
  const q = state.quizQuestions[state.currentIndex];
  const total = state.quizQuestions.length;
  const pct = Math.round(((state.currentIndex) / total) * 100);

  const optionsHtml = q.options.map((opt, idx) => {
    let cls = 'option';
    let disabledAttr = '';
    if (state.locked) {
      disabledAttr = 'disabled';
      if (idx === q.correct) cls += ' correct';
      else if (idx === state.lockedChoice) cls += ' incorrect';
      else cls += ' dim';
    }
    const letter = String.fromCharCode(65 + idx);
    return `
    <button class="${cls}" ${disabledAttr} onclick="chooseAnswer(${idx})">
      <span class="option-badge">${letter}</span>
      <span>${stripLabel(opt)}</span>
    </button>`;
  }).join('');

  let feedback = '';
  if (state.locked) {
    const wasCorrect = state.lockedChoice === q.correct;
    feedback = `<div class="feedback-note ${wasCorrect?'correct':'incorrect'}">${wasCorrect ? 'Correct!' : 'Not quite — correct answer highlighted above.'}</div>`;
  }

  const nextBtn = state.locked
    ? `<div class="next-row"><button class="btn-primary" onclick="advance()">${state.currentIndex+1 < total ? 'Next question' : 'See results'}</button></div>`
    : '';

  return `
  <div class="topbar">
    <button class="btn-ghost" onclick="confirmExitQuiz()">&larr; Exit</button>
    <div class="theme-toggle">
      <button aria-label="Light theme" class="${state.theme==='light'?'active':''}" onclick="setTheme('light')">${iconSun()}</button>
      <button aria-label="Auto theme" class="${state.theme==='auto'?'active':''}" onclick="setTheme('auto')">${iconAuto()}</button>
      <button aria-label="Dark theme" class="${state.theme==='dark'?'active':''}" onclick="setTheme('dark')">${iconMoon()}</button>
    </div>
  </div>
  <div class="quiz-top">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="progress-label mono">${state.currentIndex+1}/${total}</div>
  </div>
  <div class="timer-row" id="timeLeft">⏱ ${formatDuration(state.quizEndTime - Date.now())}</div>
  <div class="card">
    <div class="topic-tag">${q.topic}</div>
    <div class="question-text">${q.text}</div>
    <div class="options">${optionsHtml}</div>
    ${feedback}
    ${nextBtn}
  </div>`;
}

function confirmExitQuiz() {
  if (confirm('Leave this quiz? Your progress on this run will be lost.')) {
    restart();
  }
}

function renderResults() {
  const total = state.quizQuestions.length;
  const pct = total ? ((state.score / total) * 100).toFixed(1) : '0.0';
  const reviewHtml = state.answers.map((a, idx) => `
    <div class="review-item ${a.correct?'correct':'incorrect'}">
      <div class="review-q">${idx+1}. ${a.text}
        <span class="chip ${a.correct?'correct':'incorrect'}">${a.correct?'CORRECT':'WRONG'}</span>
      </div>
      <div class="review-a"><b>Your answer:</b> ${a.userText}</div>
      ${!a.correct ? `<div class="review-a"><b>Correct answer:</b> ${a.correctText}</div>` : ''}
      ${a.timeTakenSec != null ? `<div class="review-a"><b>Time taken:</b> ${a.timeTakenSec.toFixed(1)}s</div>` : ''}
    </div>`).join('');

  return `
  ${topbarHtml()}
  <div class="stack">
    ${state.timedOut ? `<div class="timedout-banner">⏱ Time's up — the 3-hour limit was reached, quiz ended automatically</div>` : ''}
    <div class="card score-hero">
      <div class="score-num">${pct}%</div>
      <div class="score-sub">${state.score} of ${total} correct</div>
    </div>

    <div class="export-row">
      <button class="export-btn" onclick="exportExcel()">${iconXls()} Excel (.xlsx)</button>
      <button class="export-btn" onclick="exportPDF()">${iconPdf()} PDF report</button>
    </div>

    <div class="section-label">Full review</div>
    <div class="card" style="padding:6px 14px;">${reviewHtml}</div>

    <button class="btn-secondary" onclick="restart()">Choose new topics</button>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  let html = '';
  switch (state.screen) {
    case 'loading': html = renderLoading(); break;
    case 'error': html = renderError(); break;
    case 'setup': html = renderSetup(); break;
    case 'quiz': html = renderQuiz(); break;
    case 'results': html = renderResults(); break;
  }
  app.innerHTML = html;
}

/* ============================================================
   8. Boot
   ============================================================ */
applyTheme();
loadData();
</script>
</body>
</html>
